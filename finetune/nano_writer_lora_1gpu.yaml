# LoRA SFT — Nemotron-3-Nano-30B-A3B as the inspection-brief writer, ONE GPU.
#
# This is the variant that runs under the omc-team14 QOS, which caps the whole
# team at a single B300 (see CLUSTER_NOTES.md). At 275 GB HBM one card holds the
# ~60 GB BF16 checkpoint with room to spare, so the cap costs parallelism rather
# than capability.
#
# Derived from two NVIDIA recipes for this exact model:
#   examples/llm_finetune/nemotron/nemotron_nano_v3_singlegpu_lora.yaml
#   examples/llm_finetune/nemotron/nemotron_nano_v3_hellaswag_peft.yaml
# with the dataset swapped for our curated corpus.
#
# Three settings are NOT preferences:
#
#   exclude_modules: ["*.out_proj"]
#     Nemotron-3-Nano is a hybrid Mamba-2 / Transformer MoE. The Mamba-2 layers
#     consume out_proj.weight inside a custom kernel where LoRA cannot apply.
#
#   mask_generation_prompt: true
#     The chat template injects an empty reasoning block into every assistant
#     turn that carries no reasoning_content. Training with loss on that block
#     teaches the model to open its reasoning and immediately close it — and the
#     failure this fine-tune exists to fix is a degenerate reasoning loop.
#
#   ep_size: 1 + activation_checkpointing + use_memory_efficient_lora
#     All experts local on one device; recompute block activations; do not keep
#     the LoRA-A activation. Together these are what make 30B fit comfortably.
#
# Paths marked  <<SET>>  are filled in by sbatch_sft_1gpu.sh from $DVIT_DATA.
#
# Run:
#   sbatch finetune/sbatch_sft_1gpu.sh
# or interactively, inside the container:
#   OMP_NUM_THREADS=8 MKL_NUM_THREADS=8 \
#     automodel finetune/nano_writer_lora_1gpu.yaml --nproc-per-node 1

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 100
  val_every_steps: 50
  max_steps: 400
  num_epochs: 3

dist_env:
  backend: nccl
  # The first run merges split MoE expert tensors on CPU and may pull ~60 GB;
  # give the rendezvous room before it decides a rank is dead.
  timeout_minutes: 90

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  torch_dtype: auto
  trust_remote_code: true
  attn_implementation: sdpa
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    rms_norm: torch_fp32
    linear: torch
    dispatcher: torch

compile:
  enabled: false

checkpoint:
  enabled: true
  checkpoint_dir: <<SET>>/checkpoints/nano_writer_lora_1gpu
  model_save_format: safetensors
  save_consolidated: final

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  exclude_modules: ["*.out_proj"]   # Mamba-2 custom kernel; LoRA cannot apply
  dim: 16
  alpha: 32
  use_triton: True
  use_memory_efficient_lora: True

distributed:
  strategy: fsdp2
  dp_size: 1
  tp_size: 1
  cp_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.ChatDataset
  path_or_dataset_id: <<SET>>/sft/train.jsonl
  seq_length: 16384
  padding: do_not_pad
  truncation: do_not_truncate
  mask_generation_prompt: true
  skip_invalid_samples: false   # a malformed line is a bug in curate.py, not noise

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: True

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.ChatDataset
  path_or_dataset_id: <<SET>>/sft/validation.jsonl
  seq_length: 16384
  padding: do_not_pad
  truncation: do_not_truncate
  mask_generation_prompt: true

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 5.0e-6
  weight_decay: 0

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 5.0e-7

